<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#020304">
  <title>FIT Casino Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="/casino.css">
  <style>
    .admin-shell{width:min(100%,860px);margin:auto;padding:max(14px,env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom));position:relative}
    .admin-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.admin-top h1{margin:3px 0 0;font-size:27px}.admin-top small{font-size:8px;letter-spacing:.16em;color:#788397;font-weight:900}
    .admin-back{border:1px solid rgba(255,255,255,.08);background:#090c11;color:#fff;border-radius:13px;padding:11px 13px}
    .admin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.admin-stat{padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(145deg,#090c12,#050608)}.admin-stat small{display:block;color:#768195;font-size:7px;letter-spacing:.1em}.admin-stat b{display:block;margin-top:5px;font-size:18px;color:#f5e0a0}
    .admin-card{margin-top:11px;padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:22px;background:linear-gradient(145deg,#090c12,#050608)}.admin-card h2{font-size:18px;margin:0 0 11px}.admin-search{width:100%;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#070a0e;color:#fff;padding:12px;margin-bottom:10px}
    .admin-user,.admin-market,.admin-aid{padding:12px;border-radius:16px;background:#0c1118;border:1px solid rgba(255,255,255,.07);margin-bottom:7px}.admin-user-head,.admin-market-head,.admin-aid-head{display:flex;justify-content:space-between;gap:9px}.admin-user b,.admin-market b,.admin-aid b{font-size:11px}.admin-user small,.admin-market small,.admin-aid small{display:block;color:#7b8799;font-size:8px;margin-top:3px}.admin-user-head>span{color:#f3d47f;font-size:11px;font-weight:900}
    .admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.admin-actions input{grid-column:1/-1;border:1px solid rgba(255,255,255,.08);background:#070a0e;color:#fff;border-radius:10px;padding:10px}.admin-actions button,.market-actions button,.aid-actions button{border-radius:10px;padding:9px;border:1px solid rgba(255,255,255,.08);font-size:8px;font-weight:900;background:#0b0f15}
    .add{color:#73e0b2!important;border-color:rgba(80,219,163,.17)!important}.sub,.reject{color:#ff8ba4!important;border-color:rgba(255,96,126,.17)!important}.approve{color:#8ae9ff!important;border-color:rgba(108,220,255,.18)!important}.cancel{color:#f0cd7a!important}.delete{color:#ff849f!important}.settle{color:#bca2ff!important;border-color:rgba(174,137,255,.18)!important}
    .market-outcomes{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.market-outcomes span{padding:5px 7px;border-radius:8px;background:#111722;font-size:7px;color:#aab4c4}.market-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:9px}.market-actions select{grid-column:1/-1;border:1px solid rgba(255,255,255,.08);background:#070a0e;color:#fff;border-radius:10px;padding:10px}.aid-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.admin-game{display:grid;grid-template-columns:1.2fr .7fr .8fr .7fr;gap:7px;padding:9px;border-radius:12px;background:#0b0f15;font-size:7px;margin-bottom:5px}.admin-game span{color:#8792a3}.admin-error{padding:18px;border:1px dashed rgba(255,255,255,.08);border-radius:15px;text-align:center;color:#7c8799;font-size:9px}
    @media(min-width:650px){.admin-stats{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="noise"></div>
  <main class="admin-shell">
    <header class="admin-top"><div><small>FIT BLACK · CONTROL</small><h1>Админ-панель</h1></div><button class="admin-back" onclick="location.href='/'">← Казино</button></header>
    <section id="adminStats" class="admin-stats"></section>

    <section class="admin-card"><h2>Ожидают подтверждения</h2><div id="pendingMarkets"></div></section>
    <section class="admin-card"><h2>Открытые ставки</h2><div id="openMarkets"></div></section>
    <section class="admin-card"><h2>Запросы после долга</h2><div id="aidRequests"></div></section>

    <section class="admin-card"><h2>Игроки</h2><input id="search" class="admin-search" placeholder="Имя, username или Telegram ID"><div id="users"></div></section>
    <section class="admin-card"><h2>Статистика слотов</h2><div id="games"></div></section>
  </main>
  <div id="toast" class="toast"></div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
