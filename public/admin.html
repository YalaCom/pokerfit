<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <title>FIT Casino Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-shell{width:min(100%,760px);margin:auto;padding:max(14px,env(safe-area-inset-top)) 12px calc(26px + env(safe-area-inset-bottom));position:relative;z-index:1}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.admin-top h1{font-size:24px;margin:0}.admin-top small{display:block;color:#8f98ab;font-size:8px;letter-spacing:.15em}.admin-back{border:1px solid rgba(255,255,255,.08);background:#121722;color:#fff;border-radius:13px;padding:11px 14px}.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.admin-stat{padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:#0f141e}.admin-stat small{display:block;color:#7e889b;font-size:7px}.admin-stat b{display:block;margin-top:5px;font-size:17px;color:#ffdf83}.admin-card{margin-top:10px;padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:#0d121b}.admin-card h2{font-size:16px;margin:0 0 11px}.admin-user{padding:12px;border-radius:16px;background:#141a25;border:1px solid rgba(255,255,255,.07);margin-bottom:8px}.admin-user-head{display:flex;justify-content:space-between;gap:10px}.admin-user-head b{font-size:12px}.admin-user-head span{font-size:11px;color:#ffdf83}.admin-user small{display:block;color:#7e889b;font-size:8px;margin-top:3px}.admin-actions{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:10px}.admin-actions input{min-width:0;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:#090d14;color:#fff;padding:10px}.admin-actions button{border:0;border-radius:11px;padding:10px;font-size:8px;font-weight:900}.add-btn{background:#1d8f62;color:#fff}.sub-btn{background:#9e3651;color:#fff}.zero-btn{background:#242b3a;color:#cbd2df}.admin-games{display:grid;gap:7px}.admin-game{display:grid;grid-template-columns:1.2fr .7fr .8fr .7fr;gap:8px;align-items:center;padding:10px;border-radius:13px;background:#111722;font-size:8px}.admin-game b{font-size:9px}.admin-game span{color:#9aa4b6}.admin-error{padding:20px;border-radius:18px;background:#231019;color:#ff9daf;text-align:center}.admin-search{width:100%;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:#090d14;color:#fff;padding:12px;margin-bottom:10px}.admin-refresh{width:100%;margin-top:8px;border:1px solid rgba(245,196,81,.28);background:rgba(245,196,81,.08);color:#ffdf83;border-radius:13px;padding:12px;font-weight:900}
  </style>
</head>
<body>
  <div class="bg-orb orb-a"></div><div class="bg-orb orb-b"></div>
  <main class="admin-shell">
    <header class="admin-top"><div><small>FIT CASINO</small><h1>Админ-панель</h1></div><button class="admin-back" onclick="location.href='/'">← В казино</button></header>
    <section id="adminStats" class="admin-stats"></section>
    <section class="admin-card"><h2>Игроки</h2><input id="search" class="admin-search" placeholder="Имя, username или Telegram ID"><div id="users"></div><button id="refresh" class="admin-refresh">ОБНОВИТЬ</button></section>
    <section class="admin-card"><h2>Статистика игр</h2><div id="games" class="admin-games"></div></section>
  </main>
  <div id="toast" class="toast"></div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
