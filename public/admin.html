<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>FIT Poker Admin</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><link rel="stylesheet" href="/styles.css"><style>.admin-wrap{padding:calc(env(safe-area-inset-top) + 20px) 16px 40px}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.admin-search{display:flex;gap:7px}.admin-search input{flex:1;border:1px solid var(--line);background:#070b09;color:#fff;border-radius:12px;padding:12px}.admin-row{padding:14px;border:1px solid var(--line);background:#090e0c;border-radius:17px;margin-top:9px}.admin-row .top{display:flex;justify-content:space-between;gap:12px}.admin-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.admin-controls button,.admin-deduct button{border:1px solid var(--line);background:#0d1411;color:#fff;border-radius:10px;padding:10px;font-size:9px;font-weight:800}.admin-controls .danger,.admin-deduct .danger{color:#ff9b9b;border-color:#4a2424}.admin-deduct{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;margin-top:8px}.admin-deduct input{min-width:0;border:1px solid #59462a;background:#080b09;color:#f4dc8b;border-radius:10px;padding:11px;font-size:13px}.admin-deduct input::placeholder{color:#766c58}.admin-deduct .admin-zero{background:#2b0d10;color:#ffb2b2}.tabs{display:flex;gap:6px;margin:15px 0}.tabs button{flex:1;border:1px solid var(--line);background:#0c120f;color:#89948e;border-radius:10px;padding:9px}.tabs button.active{color:#e0c878}@media(max-width:430px){.admin-deduct{grid-template-columns:1fr 1fr}.admin-deduct input{grid-column:1/-1}}</style></head><body><div class="admin-wrap"><div class="admin-head"><div><small class="eyebrow">CONTROL ROOM</small><h1>Admin Panel</h1></div><button class="ghost-btn" onclick="history.back()">НАЗАД</button></div><div id="status" class="empty">Проверка доступа…</div><div id="panel" class="hidden"><div class="tabs"><button data-tab="users" class="active">Игроки</button><button data-tab="tables">Столы</button><button data-tab="tournaments">Турниры</button><button data-tab="logs">Логи</button></div><div id="usersTab"><div class="admin-search"><input id="q" placeholder="ID / username / имя"><button id="search" class="ghost-btn">НАЙТИ</button></div><div id="users"></div></div><div id="tablesTab" class="hidden"><div id="tables"></div></div><div id="tournamentsTab" class="hidden"><div class="admin-row"><b>Создать турнир</b><div class="modal-form" style="margin-top:10px"><input id="tn" value="CUSTOM EVENT" placeholder="Название"><input id="ts" type="datetime-local"><input id="tb" type="number" value="100000" placeholder="Buy-In"><input id="tstack" type="number" value="50000" placeholder="Start Stack"><input id="tmax" type="number" value="81" placeholder="Max Players"><button id="tcreate" class="gold-button">СОЗДАТЬ</button></div></div><div id="tournaments"></div></div><div id="logsTab" class="hidden"><div id="logs"></div></div></div></div><div id="toast" class="toast"></div><script type="module" src="/admin.js"></script></body></html>
