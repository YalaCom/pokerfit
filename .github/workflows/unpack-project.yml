name: Unpack FIT Poker project

on:
  push:
    branches: [main]
    paths:
      - 'fit_poker_payload.b64'
      - '.github/workflows/unpack-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d fit_poker_payload.b64 > /tmp/fit-poker.tar.gz
          tar -tzf /tmp/fit-poker.tar.gz >/dev/null

      - name: Unpack complete project
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/fit-poker.tar.gz -C .
          rm -f fit_poker_payload.b64
          rm -f .github/workflows/unpack-project.yml

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f src/index.js
          test -f src/durable/PokerTableDO.js
          test -f public/index.html
          test -f public/app.js
          test -f migrations/0001_full_schema.sql
          node --check src/index.js
          node --check src/poker/engine.js
          node --check src/blackjack.js
          node --test tests/*.test.mjs

      - name: Commit unpacked project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FIT Poker Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Install complete FIT Poker Club project'
          git push origin HEAD:main
